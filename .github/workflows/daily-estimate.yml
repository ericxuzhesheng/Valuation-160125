name: Daily 160125 post-market NAV estimate

on:
  workflow_dispatch:
    inputs:
      as_of_date:
        description: "Optional valuation date in YYYY-MM-DD; leave blank for today in Beijing time"
        required: false
        type: string
  schedule:
    # Publish Monday-Friday reports the next morning at 08:00 Beijing time.
    - cron: "0 8 * * 2-6"
      timezone: Asia/Shanghai

permissions:
  contents: read

jobs:
  estimate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Estimate and email
        env:
          AS_OF_DATE: ${{ inputs.as_of_date }}
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: 1874103486@qq.com
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            AS_OF_DATE="$(date --date='yesterday' +%F)"
          fi
          python -m valuation_160125.cli --date "$AS_OF_DATE" --send-email --output-dir artifacts

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nav-estimate-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: warn
